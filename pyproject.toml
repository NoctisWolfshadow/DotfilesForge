[project]
name = "dotfilesforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NoctisWolfshadow", email = "basilgarrad@yahoo.de" }
]
requires-python = ">=3.10"
dependencies = [
    "packaging>=26.0",
    "tomli>=1.1.0 ; python_full_version < '3.11'",
]

[project.scripts]
dotfilesforge = "dotfilesforge:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
