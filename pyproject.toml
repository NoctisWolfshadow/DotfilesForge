[project]
name = "dotfilesforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NoctisWolfshadow", email = "basilgarrad@yahoo.de" }
]
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.46",
    "packaging>=26.0",
    "typing-extensions>=4.15.0 ; python_full_version < '3.12'",
]

[project.scripts]
dotfilesforge = "dotfilesforge:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
